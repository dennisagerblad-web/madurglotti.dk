<p><span class="verdana08"><font color="#009999"> <b>havnsmand </b>(havn = torshavn)<br>
  <br>
  jeg er en havnsmand <br>
  jeg er en havnsfyr <br>
  jeg er en havnshankat <br>
  <br>
  jeg bor i havn <br>
  jeg går på gaderne i havn <br>
  jeg har ondt i havn <br>
  jeg kommer i havn <br>
  <br>
  jeg børster tender i havn <br>
  jeg står nøgen i havn <br>
  jeg mangler tøj i havn <br>
  jeg snakker om københavn</font></span></p>
