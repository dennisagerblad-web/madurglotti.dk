<body bgcolor="#000000" leftmargin="3" topmargin="1" ONBLUR='window.close()'>
<p><span class="verdana08"><font color="#009999"> <b>nakin?</b> <br>
  <br>
  vilt tú gera alt fyri meg ? <br>
  hvat eg so bið teg um ?<br>
  vilt tú sita her hjá mær -<br>
  <br>
  nakin ?<br>
  uttan klæðir ?<br>
  bera húð ?<br>
  við sálini uttaná ?<br>
  so eri eg tín <br>
  <br>
  vilt tú vera í kvirru við mær ?<br>
  hyggja meg í eyguni ?<br>
  vilt tú liggja her hjá mær -<br>
  <br>
  vilt tú avduka títt innasta ?<br>
  siga sannleikan fyri mær ?</font></span></p>
</body>
